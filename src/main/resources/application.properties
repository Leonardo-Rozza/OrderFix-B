spring.application.name=mvgr-reparaciones-backend

# ===================================================================
# BASE DE DATOS (las credenciales vienen de variables de entorno)
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway es el dueño del esquema; Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# FLYWAY (migraciones de base de datos)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# =================================================================
# JWT
# =================================================================
# HS256 requiere un secreto de al menos 32 bytes; la aplicación falla al iniciar si es menor.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.audience=${JWT_AUDIENCE:ordenfix-api}
security.jwt.expiration=${JWT_EXPIRATION}
security.jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}

# Límite local por instancia. En un despliegue con múltiples réplicas debe complementarse
# con un limitador compartido en el edge/proxy. X-Forwarded-For solo se confía si el proxy
# elimina cualquier valor enviado por el cliente.
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.rate-limit.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
security.rate-limit.login.requests=${RATE_LIMIT_LOGIN_REQUESTS:10}
security.rate-limit.login.window=${RATE_LIMIT_LOGIN_WINDOW:1m}
security.rate-limit.register.requests=${RATE_LIMIT_REGISTER_REQUESTS:5}
security.rate-limit.register.window=${RATE_LIMIT_REGISTER_WINDOW:1h}
security.rate-limit.account-recovery.requests=${RATE_LIMIT_ACCOUNT_REQUESTS:5}
security.rate-limit.account-recovery.window=${RATE_LIMIT_ACCOUNT_WINDOW:15m}
security.rate-limit.public-tracking-read.requests=${RATE_LIMIT_TRACKING_READ_REQUESTS:60}
security.rate-limit.public-tracking-read.window=${RATE_LIMIT_TRACKING_READ_WINDOW:1m}
security.rate-limit.public-tracking-action.requests=${RATE_LIMIT_TRACKING_ACTION_REQUESTS:10}
security.rate-limit.public-tracking-action.window=${RATE_LIMIT_TRACKING_ACTION_WINDOW:10m}
security.rate-limit.mercado-pago-webhook.requests=${RATE_LIMIT_MP_WEBHOOK_REQUESTS:300}
security.rate-limit.mercado-pago-webhook.window=${RATE_LIMIT_MP_WEBHOOK_WINDOW:1m}

# =================================================================
# PLANES / SUSCRIPCIONES (freemium)
# =================================================================
plan.free.max-reparaciones-mes=${FREE_MAX_REPARACIONES:25}
plan.trial-dias=14

# URL pública del frontend (para armar links de seguimiento que se comparten con el cliente)
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

# Orígenes CORS permitidos (separados por coma). En prod agregá tu dominio del frontend.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://mvgr-reparaciones-frontend.vercel.app}

# =================================================================
# MERCADOPAGO (suscripción PRO - preapproval / cobro recurrente)
# Configurá MP_ENABLED y las credenciales mediante variables de entorno.
# =================================================================
mercadopago.enabled=${MP_ENABLED:false}
mercadopago.checkout-enabled=${MP_CHECKOUT_ENABLED:false}
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.api-url=${MP_API_URL:https://api.mercadopago.com}
mercadopago.collector-id=${MP_COLLECTOR_ID:}
mercadopago.application-id=${MP_APPLICATION_ID:}
mercadopago.reason=${MP_REASON:OrdenFix PRO - Suscripción mensual}
mercadopago.amount=${MP_AMOUNT:24900}
mercadopago.currency=${MP_CURRENCY:ARS}
mercadopago.back-url=${MP_BACK_URL:http://localhost:5173/suscripcion/resultado}
mercadopago.connect-timeout=${MP_CONNECT_TIMEOUT:3s}
mercadopago.read-timeout=${MP_READ_TIMEOUT:8s}
mercadopago.webhook-tolerance=${MP_WEBHOOK_TOLERANCE:5m}
mercadopago.webhook-processing-timeout=${MP_WEBHOOK_PROCESSING_TIMEOUT:1m}
mercadopago.webhook-max-attempts=${MP_WEBHOOK_MAX_ATTEMPTS:8}
mercadopago.webhook-retry-delay=${MP_WEBHOOK_RETRY_DELAY:5m}
mercadopago.reconciliation-delay=${MP_RECONCILIATION_DELAY:6h}
mercadopago.reconciliation-initial-delay=${MP_RECONCILIATION_INITIAL_DELAY:5m}
mercadopago.reconciliation-batch-size=${MP_RECONCILIATION_BATCH_SIZE:100}
mercadopago.reconciliation-max-payment-pages=${MP_RECONCILIATION_MAX_PAYMENT_PAGES:5}

# =================================================================
# EMAIL (Resend por SMTP - reset de contraseña y verificación de email)
# Configurá MAIL_ENABLED y las credenciales mediante variables de entorno.
# Con MAIL_ENABLED=false no se envían emails ni se registra su contenido.
# =================================================================
mail.enabled=${MAIL_ENABLED:false}
# Remitente. Para producción: un dominio verificado en Resend (ej: OrdenFix <no-reply@tudominio.com>).
# Para probar sin dominio: onboarding@resend.dev (solo manda a tu propio email de Resend).
mail.from=${MAIL_FROM:OrdenFix <onboarding@resend.dev>}
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Vencimiento de los tokens de cuenta
auth.token.reset-horas=1
auth.token.verificacion-horas=48

# =================================================================
# ACTUATOR (health para readiness/liveness del deploy)
# =================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# El check de SMTP no debe tumbar el health (los fallos de envío ya se loguean):
# sin esto, con mail sin configurar el health da DOWN y el deploy rebota.
management.health.mail.enabled=false

# =================================================================
# SERVER
# =================================================================
server.port=${PORT:8080}

# QR de cobro: el request admite margen para los headers multipart, no otro archivo mayor.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# ==============================================================
# LOGGING
# ===============================================================
logging.level.root=INFO
# En prod dejar INFO; para depurar en dev: LOG_LEVEL=DEBUG
logging.level.com.leonardorozza.mvgrreparacionesbackend=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO

# Credenciales del admin inicial (seeding)
admin.user=${ADMIN_USER}
admin.password=${ADMIN_PASSWORD}
admin.email=${ADMIN_EMAIL}

# Los secretos se inyectan mediante variables de entorno. Para desarrollo local también
# se admite un archivo externo, fuera del repositorio y con permisos restringidos, indicado
# mediante SPRING_CONFIG_IMPORT=optional:file:/ruta/segura/ordenfix-secrets.properties.
# Nunca guardar secretos dentro de src/main/resources ni incorporarlos al artefacto.
