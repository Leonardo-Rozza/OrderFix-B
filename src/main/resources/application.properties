spring.application.name=mvgr-reparaciones-backend

# Importa archivo con credenciales SECRETAS
spring.config.import=optional:classpath:application-secret.properties

# ===================================================================
# BASE DE DATOS (las credenciales vienen del secreto / variables de entorno)
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway es el dueño del esquema; Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# FLYWAY (migraciones de base de datos)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# =================================================================
# JWT
# =================================================================
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.expiration=${JWT_EXPIRATION}

# =================================================================
# PLANES / SUSCRIPCIONES (freemium)
# =================================================================
plan.free.max-reparaciones-mes=${FREE_MAX_REPARACIONES:25}
plan.trial-dias=14

# URL pública del frontend (para armar links de seguimiento que se comparten con el cliente)
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

# Orígenes CORS permitidos (separados por coma). En prod agregá tu dominio del frontend.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://mvgr-reparaciones-frontend.vercel.app}

# =================================================================
# MERCADOPAGO (suscripción PRO - preapproval / cobro recurrente)
# Poné MP_ENABLED=true y MP_ACCESS_TOKEN=TEST-... para activar.
# =================================================================
mercadopago.enabled=${MP_ENABLED:false}
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.reason=${MP_REASON:OrdenFix PRO - Suscripción mensual}
mercadopago.amount=${MP_AMOUNT:24900}
mercadopago.currency=${MP_CURRENCY:ARS}
mercadopago.back-url=${MP_BACK_URL:http://localhost:5173/suscripcion/resultado}

# =================================================================
# EMAIL (Resend por SMTP - reset de contraseña y verificación de email)
# Poné MAIL_ENABLED=true y MAIL_PASSWORD=<API key de Resend> para activar.
# Con MAIL_ENABLED=false los emails se loguean en vez de enviarse (dev).
# =================================================================
mail.enabled=${MAIL_ENABLED:false}
# Remitente. Para producción: un dominio verificado en Resend (ej: OrdenFix <no-reply@tudominio.com>).
# Para probar sin dominio: onboarding@resend.dev (solo manda a tu propio email de Resend).
mail.from=${MAIL_FROM:OrdenFix <onboarding@resend.dev>}
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Vencimiento de los tokens de cuenta
auth.token.reset-horas=1
auth.token.verificacion-horas=48

# =================================================================
# ACTUATOR (health para readiness/liveness del deploy)
# =================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# El check de SMTP no debe tumbar el health (los fallos de envío ya se loguean):
# sin esto, con mail sin configurar el health da DOWN y el deploy rebota.
management.health.mail.enabled=false

# =================================================================
# SERVER
# =================================================================
server.port=${PORT:8080}

# ==============================================================
# LOGGING
# ===============================================================
logging.level.root=INFO
# En prod dejar INFO; para depurar en dev: LOG_LEVEL=DEBUG
logging.level.com.leonardorozza.mvgrreparacionesbackend=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO

# Credenciales del admin inicial (seeding)
admin.user=${ADMIN_USER}
admin.password=${ADMIN_PASSWORD}

# NOTA: las credenciales (DB, JWT, admin, MercadoPago) viven en
# application-secret.properties (gitignored). Ver ese archivo para configurarlas en local.