# ============================================================
# Config de TEST: H2 en memoria (no depende de Docker/Postgres)
# Verifica que el contexto de Spring Boot levante completo.
# ============================================================
spring.application.name=mvgr-reparaciones-backend-test

# H2 en modo PostgreSQL, esquema creado por Hibernate (Flyway desactivado en test)
spring.datasource.url=jdbc:h2:mem:ordenfix;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

# JWT (valores dummy para el contexto de test)
security.jwt.secret=test-secret-key-para-jwt-hmac256-0123456789
security.jwt.issuer=ordenfix-test
security.jwt.expiration=3600000

# Admin sembrado por DataLoader
admin.user=admin
admin.password=admin123
admin.email=admin@test.com

# Planes
plan.free.max-reparaciones-mes=50
plan.trial-dias=14

# MercadoPago desactivado en test (no se llama a la API)
mercadopago.enabled=false
