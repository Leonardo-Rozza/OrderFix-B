name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Test and verify artifact secrets
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build release image
        run: docker build --tag "ordenfix-backend:${GITHUB_SHA}" .
